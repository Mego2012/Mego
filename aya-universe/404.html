<meta name="robots" content="noindex">
<script>
  // Any unknown address goes back to the start of the experience.
  // Project sites live at /REPOSITORY-NAME/, user sites at /.
  (function () {
    var seg = location.pathname.split('/')[1] || '';
    var project = /\.github\.io$/i.test(location.hostname) && seg && seg.indexOf('.') === -1;
    location.replace(project ? '/' + seg + '/' : '/');
  })();
</script>
