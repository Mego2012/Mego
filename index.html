<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1ed" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1110" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>MEGO</title>
    <meta name="description" content="MEGO | Nutrition &amp; Fitness. Eat Smart. Train Hard. Live Better." />
    <style>
      /* splash before the app bundle loads (same tokens as styles.css) */
      #splash { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #eef1ed; transition: opacity .45s, visibility .45s; }
      @media (prefers-color-scheme: dark) { #splash { background: #0d1110; } #splash rect { fill: #26302b; } }
      #splash.gone { opacity: 0; visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="72" height="72">
        <rect width="64" height="64" rx="14" fill="#121715" />
        <g transform="translate(5.6 2.4) scale(.825)">
          <path d="M15 50V18L32 37.5L49 18V50" fill="none" stroke="#fff" stroke-width="8.5" stroke-linejoin="round" stroke-dasharray="118" stroke-dashoffset="118"><animate attributeName="stroke-dashoffset" values="118;0" dur=".7s" fill="freeze" /></path>
          <circle cx="32" cy="15.5" r="6" fill="#b8f23e" opacity="0"><animate attributeName="opacity" values="0;1" begin=".55s" dur=".25s" fill="freeze" /></circle>
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
