<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9eeec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080d0f" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>MEGO</title>
    <style>
      /* splash before the app bundle loads (same tokens as styles.css) */
      #splash { position: fixed; inset: 0; z-index: 200; display: grid; place-items: center; background: #e9eeec; color: #0a7c63; transition: opacity .45s, visibility .45s; }
      @media (prefers-color-scheme: dark) { #splash { background: #080d0f; color: #3ddcb0; } }
      #splash.gone { opacity: 0; visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="64" height="64" fill="none">
        <circle cx="16" cy="16" r="11.5" stroke="currentColor" stroke-opacity=".22" stroke-width="3.2" stroke-dasharray="54.2 72.3" transform="rotate(135 16 16)" stroke-linecap="round" />
        <circle cx="16" cy="16" r="11.5" stroke="currentColor" stroke-width="3.2" stroke-dasharray="36 72.3" transform="rotate(135 16 16)" stroke-linecap="round">
          <animate attributeName="stroke-dasharray" values="2 72.3;36 72.3" dur=".9s" fill="freeze" />
        </circle>
        <circle cx="16" cy="16" r="2.6" fill="currentColor" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
